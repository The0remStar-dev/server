<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8">
        <title>Phare Littré</title>
        <link rel="stylesheet" href="style_2.css">
    </head>
    <body>
        <header>
            <img class="logo" src="image/logo.png" alt="logo" width="70px">
            <h1 class="connexion">CONNEXION</h1>
        </header>

        <style>
            body {
                margin: 0; 
                height: 100vh; 
                background-image: url('image/fond_site.png');
                background-size: cover;       
                background-position: center;  
                background-repeat: no-repeat;
                display: flex;
                flex-direction: column;
            }

            main {
                display: flex;
                justify-content: center;
                align-items: center;
                flex: 1;
            }
        </style>

        <main>
            <div class="w3-container w3-blue-grey connexion-form">
                <div class="w3-padding-16">
                    <form method="POST" action="/login">
                        <p><label for="username">EMAIL</label></p>
                        <input type="text" required autofocus id="username" name="username"><br>

                        <p><label for="password">MOT DE PASSE</label></p>
                        <input type="password" required id="password" name="password"><br>

                        <p><button type="submit" class="btn-login">Connexion</button></p>
                    </form>

                    <p><a href="/register"><button type="button" class="btn-register">S'inscrire</button></a></p>

                    <style>
                        .btn-login, .btn-register {
                            background-color: #008279;
                            color: white;
                            padding: 10px 20px;
                            border: none;
                            border-radius: 5px;
                            font-size: 16px;
                            cursor: pointer;
                            width: 100%;
                        }

                        .btn-login:hover, .btn-register:hover {
                            background-color: #006b62;
                        }
                    </style>
                </div>
            </div>
        </main>
    </body>
</html>
